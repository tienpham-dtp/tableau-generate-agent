[project]
name = "generate-tableau-workbook"
version = "0.1.0"
description = "Two-agent AI pipeline: Snowflake → chart previews → Tableau workbook"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.80.0",
    "snowflake-connector-python>=3.0.0",
    "matplotlib>=3.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
generate-twb = "src.main:main"
